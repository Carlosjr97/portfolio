   <script>
    function scaleArtwork() {
        const wrapper = document.querySelector('.artwork-wrapper');
        const artW = 256;
        const artH = 500;
        const padding = 32;

        const scaleW = (window.innerWidth - padding) / artW;
        const scaleH = (window.innerHeight - padding) / artH;
        const scale = Math.min(scaleW, scaleH, 1);

        wrapper.style.transform = `scale(${scale})`;
    }

    window.addEventListener('resize', scaleArtwork);
    scaleArtwork();
   </script>
